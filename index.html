<style>
/* =========================================================================
   DİZAYN TOKENLƏRİ
   Konsepsiya: əməliyyat/növbə planlama aləti.
   Səhər = sunrise (isti/amber), Axşam = dusk (soyuq/indigo) — məzmuna bağlı rəng kodu.
   Balans/ədalət = emerald-teal (tərəzi).
   ========================================================================= */
:root{
  --ink:#0f1620;          /* başlıq / tünd fon */
  --ink-2:#1b2632;
  --canvas:#eef1f5;       /* tətbiq fonu */
  --surface:#ffffff;
  --surface-2:#f6f8fb;
  --line:#e2e7ee;
  --line-strong:#cdd5e0;
  --text:#182430;
  --text-2:#5b6875;
  --text-3:#8a97a5;

  --brand:#0e7c66;        /* ədalət/balans */
  --brand-ink:#0a5a4a;
  --brand-soft:#e2f2ee;

  --morning:#d98c1f;      /* səhər — sunrise */
  --morning-soft:#fbeed6;
  --morning-ink:#8a5807;

  --evening:#5350c9;      /* axşam — dusk */
  --evening-soft:#e7e6fa;
  --evening-ink:#35338f;

  --warn:#c98110;
  --warn-soft:#fbefd8;
  --danger:#cf3d3d;
  --danger-soft:#fbe4e4;
  --ok:#1f9d6b;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(16,24,32,.06), 0 1px 3px rgba(16,24,32,.05);
  --sh-2:0 4px 14px rgba(16,24,32,.10);
  --sh-3:0 12px 40px rgba(16,24,32,.18);
  --nav-h:64px;

  --ff:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff);
  background:var(--canvas);
  color:var(--text);
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.2}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:15px}
.num{font-variant-numeric:tabular-nums}

/* ---- Üst başlıq ---- */
.appbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--sh-2);
}
.appbar .logo{
  width:36px;height:36px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--morning),var(--evening));
  display:grid;place-items:center;font-size:19px;
}
.appbar .titles{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.appbar .titles b{font-size:16px;letter-spacing:-.02em}
.appbar .titles span{font-size:11.5px;color:#9fb0c0;font-weight:500}
.appbar .today{margin-left:auto;text-align:right;font-size:12px;color:#b9c6d3;white-space:nowrap}
.appbar .today b{display:block;color:#fff;font-size:13.5px}

/* ---- Səhifə qabı ---- */
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 24px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.page-head h2{font-size:20px}
.page-head .sub{color:var(--text-2);font-size:13px;margin-top:2px}

/* ---- Kartlar ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card.pad{padding:16px}
.card + .card{margin-top:12px}
.card-title{font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* ---- Düymələr ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid transparent;border-radius:var(--r);
  padding:11px 16px;font-size:14.5px;font-weight:650;
  background:var(--surface-2);color:var(--text);border-color:var(--line);
  transition:.15s ease;user-select:none;cursor:pointer;
}
.btn:hover{background:#eef2f7}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;border-color:var(--line-strong)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.danger:hover{background:#f6d5d5}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:var(--r-sm)}
.btn.block{display:flex;width:100%}
.btn.lg{padding:15px 18px;font-size:16px;border-radius:var(--r)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---- Formlar ---- */
.field{margin-bottom:12px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.input,select.input{
  width:100%;padding:11px 12px;border:1px solid var(--line-strong);
  border-radius:var(--r);background:#fff;color:var(--text);outline:none;transition:.15s;
}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;width:150px}
.stepper button{width:44px;border:none;background:var(--surface-2);font-size:22px;color:var(--text-2);line-height:1}
.stepper button:active{background:#e6ebf1}
.stepper input{flex:1;width:100%;border:none;text-align:center;font-size:19px;font-weight:700;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}

/* ---- Toggle (Bəli/Xeyr) ---- */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--sh-1)}
.seg button.on[data-v="yes"]{color:var(--brand)}
.seg button.on[data-v="no"]{color:var(--danger)}

/* ---- Nişanlar ---- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.morning{background:var(--morning-soft);color:var(--morning-ink)}
.tag.evening{background:var(--evening-soft);color:var(--evening-ink)}
.tag.perm{background:var(--brand-soft);color:var(--brand-ink)}
.tag.off{background:var(--danger-soft);color:var(--danger)}
.tag.muted{background:var(--surface-2);color:var(--text-2)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.rel{background:var(--warn-soft);color:var(--warn)}
.rel-row{display:flex;align-items:center;gap:12px}
.rel-bar{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.rel-fill{height:100%;border-radius:999px;transition:width .2s ease,background .2s ease}
.an-item{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.an-item:first-of-type{border-top:none}
.an-nm{font-weight:650;font-size:14.5px;margin-bottom:5px}
.an-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text-2);line-height:1.5;margin-top:3px}
.an-line .tag{flex:none}

/* ---- Dashboard shift setup ---- */
.shift-setup{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shift-box{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;position:relative;overflow:hidden}
.shift-box.m{background:linear-gradient(180deg,var(--morning-soft),#fff)}
.shift-box.e{background:linear-gradient(180deg,var(--evening-soft),#fff)}
.shift-box .sh-name{display:flex;align-items:center;gap:8px;font-weight:750;font-size:15px}
.shift-box.m .sh-name{color:var(--morning-ink)}
.shift-box.e .sh-name{color:var(--evening-ink)}
.shift-box .sh-time{font-size:12px;color:var(--text-2);margin:2px 0 12px}

/* ---- Ədalət göstəricisi ---- */
.fair-meter{display:flex;align-items:center;gap:16px}
.gauge{--v:0;position:relative;width:96px;height:96px;flex:none;border-radius:50%;
  background:conic-gradient(var(--gc,var(--brand)) calc(var(--v)*1%),var(--line) 0);
  display:grid;place-items:center}
.gauge::after{content:"";position:absolute;inset:11px;background:var(--surface);border-radius:50%}
.gauge b{position:relative;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums}
.fair-meter .fx{flex:1}
.fair-meter .fx .lab{font-size:13px;color:var(--text-2)}
.fair-meter .fx .verdict{font-size:16px;font-weight:750;margin-top:2px}

/* ---- Result / assignment lists ---- */
.assign-col{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.assign-col > .head{padding:11px 14px;font-weight:750;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.assign-col.m > .head{background:var(--morning-soft);color:var(--morning-ink)}
.assign-col.e > .head{background:var(--evening-soft);color:var(--evening-ink)}
.assign-col .cnt{font-size:12px;font-weight:600;opacity:.85}
.slot{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.slot .av{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:var(--ink-2)}
.slot .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm small{display:block;font-weight:500;color:var(--text-3);font-size:11.5px}
.slot.empty .nm{color:var(--danger);font-weight:600}

/* ---- Tiles (işçilər/tarixçə) ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;box-shadow:var(--sh-1);text-align:left;position:relative;transition:.15s}
.tile:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.tile.inactive{opacity:.55}
.tile .tav{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#fff;margin-bottom:9px}
.tile .tnm{font-weight:700;font-size:14.5px;line-height:1.2}
.tile .tmeta{font-size:11.5px;color:var(--text-2);margin-top:2px}
.tile .ttags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.tile-add{border:1.5px dashed var(--line-strong);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--brand);font-weight:650;min-height:118px}

/* ---- Overlay (fullscreen detail) ---- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--canvas);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);visibility:hidden}
.overlay.open{transform:none;visibility:visible}
.overlay .ov-bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;z-index:2}
.overlay .ov-bar h3{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-back{border:none;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:650;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--text)}
.overlay .ov-body{flex:1;overflow-y:auto;padding:16px 14px calc(30px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}

/* ---- Modal (mərkəzi) ---- */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(15,22,32,.55);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:.2s}
.modal-bg.open{opacity:1;visibility:visible}
.modal{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:560px;

<script>
/* =========================================================================
   SMEN BÖLGÜSÜ — ƏDALƏTLİ PLANLAMA SİSTEMİ
   Tək fayllı SPA. Məlumat LocalStorage-də saxlanılır.
   Kod modullara bölünüb ki, sonradan Firebase-ə keçirmək asan olsun:
     - Store  : yaddaş qatı (yalnız bunu Firebase ilə əvəz etmək kifayətdir)
     - SmenCore: təmiz məntiq (DOM/yaddaşdan asılı deyil, test olunandır)
     - Stats/Gen/Repl: biznes əməliyyatları
     - UI     : interfeys
   ========================================================================= */

/* ------------------------------- UTIL ---------------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = (p='id')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const AY = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const GUN = ['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'];

function todayISO(){ const d=new Date(); return isoOf(d.getFullYear(),d.getMonth()+1,d.getDate()); }
function isoOf(y,m,d){ return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function partsOf(iso){ const [y,m,d]=iso.split('-').map(Number); return {y,m,d}; }
function addDaysISO(iso,n){ const {y,m,d}=partsOf(iso); const t=Date.UTC(y,m-1,d)+n*86400000; const dt=new Date(t); return isoOf(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate()); }
function dowIndex(iso){ const {y,m,d}=partsOf(iso); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function fmtDateAz(iso){ const {y,m,d}=partsOf(iso); return `${d} ${AY[m-1]} ${y}`; }
function dowAz(iso){ return GUN[dowIndex(iso)]; }
function monthKey(iso){ const {y,m}=partsOf(iso); return `${y}-${String(m).padStart(2,'0')}`; }
function monthLabelAz(key){ const [y,m]=key.split('-').map(Number); return `${AY[m-1]} ${y}`; }
function initials(emp){ return ((emp.name?.[0]||'')+(emp.surname?.[0]||'')).toUpperCase()||'?'; }
function fullName(emp){ return `${emp.name||''} ${emp.surname||''}`.trim(); }
/* Ada görə sabit rəng (avatarlar üçün) */
function colorOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; const hues=[210,262,150,20,340,190,45,280]; const hue=hues[h%hues.length]; return `hsl(${hue} 42% 42%)`; }

/* ------------------------------ STORE ---------------------------------- */
/* Yalnız bu qatı Firebase ilə əvəz etmək kifayətdir. */
const Store = {
  KEY:'smen_db_v1',
  load(){ try{ return JSON.parse(localStorage.getItem(this.KEY)||'null'); }catch(e){ return null; } },
  save(db){ localStorage.setItem(this.KEY, JSON.stringify(db)); },
};

const DEFAULT_SETTINGS = {
  morningStart:'08:00', morningEnd:'17:00',
  eveningStart:'17:00', eveningEnd:'01:00',
  minRestHours:12,
  maxConsecutiveDays:6,
  fairnessWeight:0.7,   // ədalət çəkisi (yüksək = az işləyənə güclü üstünlük)
  randomWeight:0.3,     // random çəkisi
  morningCount:4,
  eveningCount:5,
};

/* Qlobal məlumat obyekti */
let DB = null;

function initDB(){
  DB = Store.load();
  if(!DB){
    DB = { employees:[], assignments:[], availability:[], replacements:[], distributions:[], settings:{...DEFAULT_SETTINGS}, seeded:false };
  }
  // Parametrləri yeni sahələrlə tamamla
  DB.settings = {...DEFAULT_SETTINGS, ...(DB.settings||{})};
  for(const k of ['employees','assignments','availability','replacements','distributions']) if(!Array.isArray(DB[k])) DB[k]=[];
}
function persist(){ Store.save(DB); }

/* =========================================================================
   SMEN CORE — TƏMİZ MƏNTİQ (DOM/yaddaşdan asılı deyil, tam test olunandır)
   Bütün funksiyalar sadə məlumat qəbul edir və nəticə qaytarır.
   Randomluq üçün rng ötürülür ki, testlər deterministik olsun.
   ========================================================================= */
// ===== PURE-CORE-START =====
const SmenCore = (function(){

  const MIN = m=>m*60000;
  const OTHER = t => t==='morning' ? 'evening' : 'morning';

  /* "HH:MM" -> dəqiqə */
  function toMin(hhmm){ const [h,m]=String(hhmm).split(':').map(Number); return h*60+m; }

  /* Bir smenin başlanğıc/bitiş vaxtı (mütləq ms, UTC-əsaslı — TZ sürüşməsi olmasın) */
  function shiftWindow(dateISO, type, settings){
    const [y,m,d]=dateISO.split('-').map(Number);
    const base = Date.UTC(y,m-1,d);
    if(type==='morning'){
      return { start: base+MIN(toMin(settings.morningStart)), end: base+MIN(toMin(settings.morningEnd)) };
    }
    let s=toMin(settings.eveningStart), e=toMin(settings.eveningEnd);
    if(e<=s) e+=1440; // gecə yarısını keçir
    return { start: base+MIN(s), end: base+MIN(e) };
  }

  /* İşçinin təsdiqlənmiş təyinatlarından tarixçə indeksi qur */
  function buildIndex(assignments, settings){
    const byEmp = {}; // empId -> {dates:Set, list:[{date,type,start,end}]}
    for(const a of assignments){
      const w = shiftWindow(a.date, a.type, settings);
      (byEmp[a.employeeId] ||= {dates:new Set(), list:[]});
      byEmp[a.employeeId].dates.add(a.date);
      byEmp[a.employeeId].list.push({date:a.date, type:a.type, start:w.start, end:w.end});
    }
    return byEmp;
  }

  /* Verilmiş tarixdən əvvəl ardıcıl işlənən gün sayı */
  function consecutiveBefore(datesSet, dateISO){
    if(!datesSet) return 0;
    let n=0, cur=dateISO;
    for(let i=0;i<400;i++){
      cur = prevDay(cur);
      if(datesSet.has(cur)) n++; else break;
    }
    return n;
  }
  function prevDay(iso){ const [y,m,d]=iso.split('-').map(Number); const t=Date.UTC(y,m-1,d)-86400000; const dt=new Date(t); return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`; }

  /* Referans tarixə görə işçi statistikası (yalnız o tarixdən ƏVVƏLKİ tarixçə) */
  function statsFor(empId, refISO, idx, replacements, settings){
    const rec = idx[empId] || {dates:new Set(), list:[]};
    const refStart = shiftWindow(refISO,'morning',settings).start; // referans günün başlanğıcı
    let total=0, morning=0, evening=0, last7=0, last30=0, lastEnd=-Infinity, lastType=null;
    const d7 = refISO, d7start = shiftWindow(minusDays(refISO,7),'morning',settings).start;
    const d30start = shiftWindow(minusDays(refISO,30),'morning',settings).start;
    for(const it of rec.list){
      if(it.start >= refStart) continue; // gələcək/cari günü sayma
      total++;
      if(it.type==='morning') morning++; else evening++;
      if(it.start >= d7start) last7++;
      if(it.start >= d30start) last30++;
      if(it.end > lastEnd){ lastEnd=it.end; lastType=it.type; }
    }
    const workedDates = new Set([...rec.dates].filter(dt => shiftWindow(dt,'morning',settings).start < refStart));
    const consecutive = consecutiveBefore(workedDates, refISO);
    const replCount = (replacements||[]).filter(r=>!r.undone && r.replacementEmployeeId===empId).length;
    return { total, morning, evening, last7, last30, lastEnd, lastType, consecutive, replacements:replCount, workedDays:workedDates.size };
  }
  function minusDays(iso,n){ let c=iso; for(let i=0;i<n;i++) c=prevDay(c); return c; }

  /* İşçinin verilmiş gün+smen üçün ən son əvvəlki smen bitişi (istirahət yoxlaması üçün) */
  function lastEndBefore(empId, proposedStart, idx, pending){
    let last=-Infinity;
    const rec = idx[empId];
    if(rec) for(const it of rec.list) if(it.end<=proposedStart && it.end>last) last=it.end;
    if(pending) for(const p of pending){ if(p.employeeId!==empId) continue; if(p.end<=proposedStart && p.end>last) last=p.end; }
    return last;
  }
  function assignedThatDay(empId, dateISO, idx, pending){
    if(idx[empId] && idx[empId].dates.has(dateISO)) return true;
    if(pending) for(const p of pending) if(p.employeeId===empId && p.date===dateISO) return true;
    return false;
  }

  /* Uyğunluq yoxlaması — {ok, reasons[]} qaytarır */
  function eligibility(emp, dateISO, type, ctx, opts){
    const {settings, idx, availability, pending} = ctx;
    const permanent = !!(opts && opts.permanent);   // daimi təyinat istirahət/eyni-gün qaydalarından azaddır
    const reasons=[];
    if(!emp.active) reasons.push('Passiv işçi');
    if(type==='morning' && !emp.canWorkMorning) reasons.push('Səhər işləyə bilmir');
    if(type==='evening' && !emp.canWorkEvening) reasons.push('Axşam işləyə bilmir');

    // Əlçatanlıq (bağlı günlər) — daimi işçiyə də tətbiq olunur (o günə açıq qadağa)
    const av = (availability||[]).find(a=>a.employeeId===emp.id && a.date===dateISO);
    if(av){
      if(av.mode==='off') reasons.push('Bu gün işləyə bilmir');
      else if(av.mode==='morning' && type==='evening') reasons.push('Yalnız səhər işləyə bilir');
      else if(av.mode==='evening' && type==='morning') reasons.push('Yalnız axşam işləyə bilir');
    }

    // Eyni gündə iki smen olmaz — DAİMİ işçi istisnadır (həm səhər həm axşam işləyə bilər)
    if(!permanent && assignedThatDay(emp.id, dateISO, idx, pending)) reasons.push('Həmin gün artıq təyin olunub');

    // Minimum istirahət — DAİMİ işçi istisnadır
    if(!permanent){
      const w = shiftWindow(dateISO, type, settings);
      const le = lastEndBefore(emp.id, w.start, idx, pending);
      if(le>-Infinity){
        const restH = (w.start - le)/3600000;
        if(restH < settings.minRestHours) reasons.push(`İstirahət azdır (${restH.toFixed(0)} < ${settings.minRestHours} saat)`);
      }
    }
    return {ok:reasons.length===0, reasons};
  }

  /* Etibarlılıq faktoru: xal 100→1.0, 0→0.05 (aşağı xal = az seçim şansı) */
  function relFactor(emp){ const r=(emp.reliability==null?100:emp.reliability)/100; return Math.max(0.05, Math.min(1, r)); }

  /* Ədalət balı (prioritet) — az işləyən yüksək bal alır.
     relF: etibarlılıq faktoru (0..1). Aşağı xal → yük hədəfi aşağı (işçi az seçilir). */
  function priority(stats, ref, settings, type, relF){
    relF = (relF==null?1:relF);
    const effTotal = stats.total / relF;                     // aşağı etibarlılıq → yük daha tez "dolur"
    let base = (ref.maxTotal - effTotal) + relF;             // ümumi iş yükü balansı (etibarlılığa görə miqyaslanır)
    const typeCount = (type==='morning'?stats.morning:stats.evening) / relF;   // etibarlılığa görə effektiv
    const refType   = type==='morning'?ref.maxMorning:ref.maxEvening;
    base += Math.max(0, (refType - typeCount)) * 0.5;         // smen tipi balansı (etibarlılıqla miqyaslanır)
    // NÖVBƏLƏŞMƏ: son smeni bu tiplə eynidirsə növbəti dəfə əks smenə meyl etsin
    // (yalnız son 7 gündə işləyibsə — köhnə tarix məcbur etməməlidir)
    if(stats.lastType && stats.last7>0){
      if(stats.lastType===type) base *= 0.4;    // eyni tipi ardıcıl təkrarlama — güclü cəza
      else base *= 1.55;                          // əks tipə güclü növbələşmə (səhər→axşam / axşam→səhər)
    }
    // Ardıcıl iş günü cəzası
    if(stats.consecutive >= settings.maxConsecutiveDays) base *= 0.06;
    else if(stats.consecutive >= settings.maxConsecutiveDays-1) base *= 0.5;
    // Son 7 gündəki yükə görə yüngül sönümləmə
    base *= 1/(1 + 0.12*stats.last7);
    return Math.max(base, 0.02);
  }

  /* Prioritetdən çəki (ədalət/random balansı üstünə qoyulur) */
  function weightOf(prio, settings){
    const fw = Math.max(0.01, settings.fairnessWeight);
    const rw = Math.max(0.01, settings.randomWeight);
    const k = fw/rw; // yüksək = daha deterministik (az işləyənə güclü meyl)
    return Math.pow(prio, k);
  }

  /* Çəkili random seçim (təkrarsız), rng ötürülür */
  function weightedSample(items, n, rng){
    const pool = items.map(x=>({...x}));
    const out=[];
    for(let k=0;k<n && pool.length;k++){
      let sum=0; for(const p of pool) sum+=p.weight;
      if(sum<=0){ out.push(pool.shift().id); continue; }
      let r=rng()*sum, i=0;
      for(;i<pool.length;i++){ r-=pool[i].weight; if(r<=0) break; }
      if(i>=pool.length) i=pool.length-1;
      out.push(pool[i].id); pool.splice(i,1);
    }
    return out;
  }

  /* Referans yük (bütün aktiv işçilər üzərindən — sabit müqayisə bazası) */
  function refLoads(activeEmps, refISO, idx, replacements, settings){
    let maxTotal=0,maxMorning=0,maxEvening=0;
    const cache={};
    for(const e of activeEmps){
      const s = statsFor(e.id, refISO, idx, replacements, settings);
      cache[e.id]=s;
      maxTotal=Math.max(maxTotal,s.total); maxMorning=Math.max(maxMorning,s.morning); maxEvening=Math.max(maxEvening,s.evening);
    }
    return {ref:{maxTotal,maxMorning,maxEvening}, cache};
  }

  /* ---- BİR SMEN ÜÇÜN BÖLGÜ ----
     VALIDATE → FILTER → WORKLOAD → FAIRNESS → RULES → WEIGHTED RANDOM */
  function generateShift(dateISO, type, requiredCount, employees, ctx, rng){
    const active = employees.filter(e=>e.active);
    const permField = type==='morning'?'permanentMorning':'permanentEvening';

    // Ədalət referansı YALNIZ dəyişən (daimi olmayan) işçilər üzərindən qurulur ki,
    // daimi işçilərin yüksək yükü qalan işçilərin ədalətli bölgüsünə təsir etməsin.
    const variablePool = active.filter(e=>!e[permField]);
    const refBase = variablePool.length ? variablePool : active;
    const {ref,cache} = refLoads(refBase, dateISO, ctx.idx, ctx.replacements, ctx.settings);

    const assigned=[]; const ineligible=[];
    const usedIds=new Set();
    const pending = ctx.pending || [];

    const markPending = (empId)=>{ const w=shiftWindow(dateISO,type,ctx.settings); pending.push({employeeId:empId,date:dateISO,type,start:w.start,end:w.end}); };

    // 1) DAİMİ işçilər (random-a daxil olmurlar) — istirahət/eyni-gün qaydalarından azaddırlar
    for(const e of active){
      if(!e[permField]) continue;
      const el = eligibility(e, dateISO, type, {...ctx, pending}, {permanent:true});
      if(el.ok){ assigned.push({employeeId:e.id, isPermanent:true, assignmentType:'permanent'}); usedIds.add(e.id); markPending(e.id); }
      else ineligible.push({id:e.id, permanent:true, reasons:el.reasons});
    }

    // 2) Qalan yerlər üçün DƏYİŞƏN işçilər
    const remaining = Math.max(0, requiredCount - assigned.length);
    const candidates=[];
    for(const e of active){
      if(usedIds.has(e.id) || e[permField]) continue;
      const el = eligibility(e, dateISO, type, {...ctx, pending});
      if(!el.ok){ ineligible.push({id:e.id, permanent:false, reasons:el.reasons}); continue; }
      const prio = priority(cache[e.id], ref, ctx.settings, type, relFactor(e));
      candidates.push({id:e.id, weight:weightOf(prio,ctx.settings), prio});
    }
    const picked = weightedSample(candidates, remaining, rng);
    for(const id of picked){ assigned.push({employeeId:id, isPermanent:false, assignmentType:'random'}); usedIds.add(id); markPending(id); }

    const shortfall = Math.max(0, requiredCount - assigned.length);
    const pickedSet = new Set(picked);
    const notPicked = candidates.filter(c=>!pickedSet.has(c.id)).map(c=>c.id);   // uyğun idi, amma yer qalmadı
    return { type, required:requiredCount, assigned, shortfall, ineligible, notPicked, candidatesLeft: candidates.length - picked.length };
  }

  /* ---- ƏVƏZLƏMƏ NAMİZƏDLƏRİ ----
     Uyğun işçiləri tap → yükü müqayisə et → ən az işləyəni tövsiyə et */
  function replacementCandidates(dateISO, type, originalId, employees, ctx){
    const active = employees.filter(e=>e.active && e.id!==originalId);
    const {ref,cache} = refLoads(employees.filter(e=>e.active), dateISO, ctx.idx, ctx.replacements, ctx.settings);
    const list=[];
    for(const e of active){
      const el = eligibility(e, dateISO, type, ctx);
      const s = cache[e.id];
      const prio = el.ok ? priority(s, ref, ctx.settings, type, relFactor(e)) : 0;
      list.push({ id:e.id, eligible:el.ok, reasons:el.reasons, stats:s, prio });
    }
    // Uyğunlar prioritetə görə (yüksək öndə), sonra uyğun olmayanlar
    list.sort((a,b)=> (b.eligible-a.eligible) || (b.prio-a.prio) || (a.stats.total-b.stats.total));
    return list;
  }

  /* Ədalət göstəricisi: işçilərin ümumi yükünün nə qədər bərabər olduğu (0..100) */
  function fairnessIndex(activeEmps, refISO, idx, replacements, settings){
    const totals = activeEmps.map(e=>statsFor(e.id, addOneDay(refISO), idx, replacements, settings).total);
    if(totals.length<2) return {pct:100, spread:0, mean:0};
    const mean = totals.reduce((a,b)=>a+b,0)/totals.length;
    if(mean===0) return {pct:100, spread:0, mean:0};
    const variance = totals.reduce((a,b)=>a+(b-mean)**2,0)/totals.length;
    const cv = Math.sqrt(variance)/mean;               // dəyişkənlik əmsalı
    const pct = Math.max(0, Math.min(100, Math.round(100 - cv*100)));
    const spread = Math.max(...totals)-Math.min(...totals);
    return {pct, spread, mean:+mean.toFixed(1)};
  }
  function addOneDay(iso){ const [y,m,d]=iso.split('-').map(Number); const t=Date.UTC(y,m-1,d)+86400000; const dt=new Date(t); return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,'0')}-${String(dt.getUTCDate()).padStart(2,'0')}`; }

  /* ---- ANALİZ: kim heç bir smenə düşmədi və NİYƏ ----
     Hər aktiv, təyin olunmamış işçi üçün hər smen üzrə səbəb qaytarır:
     - uyğun deyil (istirahət, bağlı gün, o smeni işləyə bilmir, artıq təyin olunub)
     - uyğun idi, amma yer qalmadı (kifayət qədər işçi seçildi) */
  function analyzeUnassigned(draft, employees){
    const active = employees.filter(e=>e.active);
    const assignedIds = new Set([...draft.morning.assigned, ...draft.evening.assigned].map(a=>a.employeeId));
    const out=[];
    for(const e of active){
      if(assignedIds.has(e.id)) continue;
      const parts=[];
      for(const sh of [draft.morning, draft.evening]){
        if(!sh || sh.required===0) continue;   // tələb olunmayan smeni atla
        const label = sh.type==='morning' ? 'Səhər' : 'Axşam';
        const inel = (sh.ineligible||[]).find(x=>x.id===e.id);
        if(inel){ parts.push({shift:sh.type, label, text:inel.reasons.join(', ')}); }
        else if((sh.notPicked||[]).includes(e.id)){ parts.push({shift:sh.type, label, text:`yer qalmadı (${sh.assigned.length}/${sh.required} dolub)`}); }
      }
      out.push({ id:e.id, parts });
    }
    return out;
  }

  return { shiftWindow, buildIndex, statsFor, eligibility, priority, weightOf, weightedSample,
           generateShift, replacementCandidates, fairnessIndex, consecutiveBefore, refLoads, analyzeUnassigned };
})();

/* SmenCore-u DB ilə birləşdirir. */
const Ops = {
  ctx(){ return { settings:DB.settings, idx:SmenCore.buildIndex(DB.assignments,DB.settings), availability:DB.availability, replacements:DB.replacements }; },

  /* Bir tarix üçün qaralama bölgü yarat (təsdiqlənməmiş) */
  generate(dateISO, mCount, eCount){
    const base=this.ctx(); const pending=[];
    const c={...base, pending};
    const morning=SmenCore.generateShift(dateISO,'morning',mCount,DB.employees,c,Math.random);
    const evening=SmenCore.generateShift(dateISO,'evening',eCount,DB.employees,c,Math.random);
    return { date:dateISO, morning, evening, createdAt:Date.now() };
  },

  /* Təsdiqlənmiş bölgünü tap */
  distributionOf(dateISO){ return DB.distributions.find(d=>d.date===dateISO); },
  assignmentsOf(dateISO,type){ return DB.assignments.filter(a=>a.date===dateISO && (!type||a.type===type)); },

  /* Qaralamanı təsdiqlə → tarixçəyə yaz */
  confirm(draft){
    // Əvvəlki (varsa) həmin günün bölgüsünü sil
    this.removeDistribution(draft.date, false);
    const dist={ id:uid('dist'), date:draft.date, createdAt:Date.now(), status:'confirmed' };
    DB.distributions.push(dist);
    for(const type of ['morning','evening']){
      for(const a of draft[type].assigned){
        DB.assignments.push({ id:uid('as'), distributionId:dist.id, date:draft.date, type,
          employeeId:a.employeeId, isPermanent:a.isPermanent, assignmentType:a.assignmentType, createdAt:Date.now() });
      }
    }
    persist();
    return dist;
  },

  removeDistribution(dateISO, doPersist=true){
    const dist=this.distributionOf(dateISO);
    if(!dist) return;
    DB.assignments = DB.assignments.filter(a=>a.date!==dateISO);
    DB.replacements = DB.replacements.filter(r=>r.date!==dateISO);
    DB.distributions = DB.distributions.filter(d=>d.date!==dateISO);
    if(doPersist) persist();
  },

  /* Əvəzləmə namizədləri */
  replacementCandidates(dateISO,type,originalId){
    return SmenCore.replacementCandidates(dateISO,type,originalId,DB.employees,this.ctx());
  },

  /* Əvəzləməni tətbiq et */
  applyReplacement(dateISO,type,originalId,newId,kind='auto',reason=''){
    const as=DB.assignments.find(a=>a.date===dateISO && a.type===type && a.employeeId===originalId);
    if(!as) return false;
    DB.replacements.push({ id:uid('rep'), date:dateISO, type, originalEmployeeId:originalId, replacementEmployeeId:newId,
      reason, kind, createdAt:Date.now(), undone:false, prevPermanent:as.isPermanent, prevType:as.assignmentType });
    as.employeeId=newId; as.isPermanent=false; as.assignmentType = kind==='manual'?'manual':'replacement';
    persist(); return true;
  },

  /* Əvəzləməni geri qaytar */
  undoReplacement(replId){
    const r=DB.replacements.find(x=>x.id===replId && !x.undone);
    if(!r) return false;
    const as=DB.assignments.find(a=>a.date===r.date && a.type===r.type && a.employeeId===r.replacementEmployeeId);
    if(as){ as.employeeId=r.originalEmployeeId; as.isPermanent=r.prevPermanent; as.assignmentType=r.prevType; }
    r.undone=true; persist(); return true;
  },

  /* Aylıq statistika */
  monthly(mKey){
    const inMonth = iso=>monthKey(iso)===mKey;
    const [y,m]=mKey.split('-').map(Number);
    const daysInMonth=new Date(Date.UTC(y,m,0)).getUTCDate();
    const rows=DB.employees.map(e=>{
      const as=DB.assignments.filter(a=>a.employeeId===e.id && inMonth(a.date));
      const morning=as.filter(a=>a.type==='morning').length;
      const evening=as.filter(a=>a.type==='evening').length;
      const repl=DB.replacements.filter(r=>!r.undone && r.replacementEmployeeId===e.id && inMonth(r.date)).length;
      const worked=new Set(as.map(a=>a.date)).size;
      return { emp:e, total:as.length, morning, evening, repl, worked, rest:Math.max(0,daysInMonth-worked) };
    });
    return { rows, daysInMonth };
  },

  fairness(){
    const active=DB.employees.filter(e=>e.active);
    // Ədalət göstəricisi YALNIZ dəyişən (daimi olmayan) işçilər üzərindən hesablanır ki,
    // daimi işçilərin məqsədli yüksək yükü göstərici faizini yanlış aşağı salmasın.
    const variable=active.filter(e=>!e.permanentMorning && !e.permanentEvening);
    const pool = variable.length>=2 ? variable : active;
    return SmenCore.fairnessIndex(pool, todayISO(), SmenCore.buildIndex(DB.assignments,DB.settings), DB.replacements, DB.settings);
  },
};

function avatar(emp,cls='av'){ return `<div class="${cls}" style="background:${colorOf(emp.id)}">${esc(initials(emp))}</div>`; }
function empTags(emp){
  let t='';
  if(emp.permanentMorning) t+='<span class="tag perm">🔒 Səhər daimi</span>';
  if(emp.permanentEvening) t+='<span class="tag perm">🔒 Axşam daimi</span>';
  if(emp.canWorkMorning && !emp.permanentMorning) t+='<span class="tag morning">Səhər</span>';
  if(emp.canWorkEvening && !emp.permanentEvening) t+='<span class="tag evening">Axşam</span>';
  if(!emp.active) t+='<span class="tag off">Passiv</span>';
  const rel = emp.reliability==null?100:emp.reliability;
  if(rel<100) t+=`<span class="tag rel">⭐ ${rel}</span>`;
  return t;
}
function shiftName(type){ return type==='morning'?'Səhər':'Axşam'; }
function shiftTime(type){ const s=DB.settings; return type==='morning'?`${s.morningStart}–${s.morningEnd}`:`${s.eveningStart}–${s.eveningEnd}`; }

  assignColumns(dateISO, withReplace){

        return `<div class="slot">${avatar(e)}<div class="nm">${esc(fullName(e))}${replTag}</div>${a.isPermanent?lock:repl}</div>`;
      }).join('') : `<div class="slot empty"><div class="nm">Boş</div></div>`;
      return `<div class="assign-col ${cls}" style="margin-top:12px">
        <div class="head">${type==='morning'?'🌅 Səhər':'🌆 Axşam'} <span class="cnt">${as.length} nəfər · ${shiftTime(type)}</span></div>
        ${rows}</div>`;
    }).join('');
  },

  relColor(v){ return v>=80?'var(--brand)':v>=50?'var(--morning)':'var(--danger)'; },
  _syncRel(v){
    this._empForm.reliability=v;
    const fill=$('#ef_relfill'), num=$('#ef_relnum'), rng=$('#ef_relrange');
    if(fill){ fill.style.width=v+'%'; fill.style.background=this.relColor(v); }
    if(num && num.value!==String(v)) num.value=v;
    if(rng && rng.value!==String(v)) rng.value=v;
  },
  setRelValue(val){
    let v=parseInt(val,10); if(isNaN(v)) v=0;
    v=Math.max(0,Math.min(100,v));
    this._syncRel(v);
  },
  adjustRel(delta){
    let v = this._empForm.reliability==null?100:this._empForm.reliability;
    if(delta==='reset') v=100; else v=Math.max(0,Math.min(100, v+delta));
    this._syncRel(v);
  },

  renderEmpForm(){
    const e=this._empForm;
    $('#empOvBody').innerHTML=`
      <div class="card pad">
        <div class="grid2">
          <div class="field"><label>Ad</label><input id="ef_name" class="input" value="${esc(e.name)}" placeholder="Əli"></div>
          <div class="field"><label>Soyad</label><input id="ef_surname" class="input" value="${esc(e.surname)}" placeholder="Hüseynov"></div>
        </div>
        <div class="field"><label>Status</label>
          <div class="seg" data-field="active">
            <button data-v="true" class="${e.active?'on':''}" onclick="UI.setEmpField('active',true)">Aktiv</button>
            <button data-v="false" class="${!e.active?'on':''}" onclick="UI.setEmpField('active',false)">Passiv</button>
          </div>
        </div>
        <div class="field"><label>Əsas smen</label>
          <select id="ef_primary" class="input">
            <option value="morning" ${e.primaryShift==='morning'?'selected':''}>Səhər</option>
            <option value="evening" ${e.primaryShift==='evening'?'selected':''}>Axşam</option>
            <option value="both" ${e.primaryShift==='both'?'selected':''}>Hər ikisi</option>
          </select>
        </div>
      </div>

      <div class="card pad" style="margin-top:12px">
        <div class="card-title">Smen icazələri</div>
        <div class="field spread"><label style="margin:0">Səhər işləyə bilər</label>${this.segYN('canWorkMorning')}</div>
        <div class="field spread"><label style="margin:0">Axşam işləyə bilər</label>${this.segYN('canWorkEvening')}</div>
        <div class="divider"></div>
        <div class="field spread"><label style="margin:0">🔒 Səhər daimi</label>${this.segYN('permanentMorning')}</div>
        <div class="field spread" style="margin-bottom:0"><label style="margin:0">🔒 Axşam daimi</label>${this.segYN('permanentEvening')}</div>
        <div class="muted-note">Daimi işçilər random seçimə daxil edilmir — hər bölgüdə avtomatik öz smeninə düşür.</div>
      </div>

      <div class="card pad" style="margin-top:12px">
        <div class="card-title">⭐ Məsuliyyət / Etibarlılıq</div>
        <div class="rel-row">
          <div class="rel-bar"><div id="ef_relfill" class="rel-fill" style="width:${e.reliability}%;background:${this.relColor(e.reliability)}"></div></div>
          <input id="ef_relnum" class="input num" type="number" min="0" max="100" value="${e.reliability}" style="width:72px" oninput="UI.setRelValue(this.value)">
        </div>
        <input id="ef_relrange" type="range" min="0" max="100" step="1" value="${e.reliability}" style="width:100%;margin-top:12px" oninput="UI.setRelValue(this.value)">
        <div class="btn-row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
          <button class="btn ghost sm" onclick="UI.adjustRel(-5)">−5</button>
          <button class="btn ghost sm" onclick="UI.adjustRel(5)">+5</button>
          <button class="btn danger sm" onclick="UI.adjustRel(-20)">Üzürsüz gəlmədi −20</button>
          <button class="btn ghost sm" onclick="UI.adjustRel('reset')">Sıfırla 100</button>
        </div>
        <div class="muted-note">Xalı istədiyin qədər artır və ya azalt (0–100). Rəqəmi birbaşa yaza, sürüşdürə və ya düymələrlə dəyişə bilərsən. Aşağı xal → random seçimdə az şans. Daimi işçilərə və ümumi ədalətə təsir etmir.</div>
      </div>

      <div class="card pad" style="margin-top:12px">
        <div class="card-title">İşləyə bilməyəcəyi günlər</div>
        <div id="ef_avail"></div>
        <div class="grid2" style="margin-top:10px;align-items:end">
          <div class="field" style="margin:0"><label>Tarix</label><input id="ef_avdate" class="input" type="date" value="${todayISO()}"></div>
          <div class="field" style="margin:0"><label>Məhdudiyyət</label>
            <select id="ef_avmode" class="input">
              <option value="off">Bütün gün bağlı</option>
              <option value="morning">Yalnız səhər işləyə bilər</option>
              <option value="evening">Yalnız axşam işləyə bilər</option>
            </select></div>
        </div>
        <button class="btn ghost sm block" style="margin-top:10px" onclick="UI.addAvail()">+ Əlavə et</button>
      </div>

      <div class="btn-row" style="margin-top:16px">
        <button class="btn primary block" onclick="UI.saveEmp()">Yadda saxla</button>
      </div>
      ${e.id?`<button class="btn danger block" style="margin-top:10px" onclick="UI.deleteEmp()">İşçini sil</button>`:''}
    `;
    this.renderEmpAvail();
  },

  renderEmpAvail(){
    const box=$('#ef_avail'); if(!box) return;
    if(!this._empAvail.length){ box.innerHTML=`<div class="muted-note" style="margin:0">Bağlı gün yoxdur.</div>`; return; }
    const modeLbl={off:'Bütün gün bağlı',morning:'Yalnız səhər',evening:'Yalnız axşam'};
    box.innerHTML=this._empAvail.sort((a,b)=>a.date.localeCompare(b.date)).map((a,i)=>`
      <div class="slot" style="padding:9px 0;border-top:${i?'1px solid var(--line)':'none'}">
        <span class="tag ${a.mode==='off'?'off':'muted'}">${a.mode==='off'?'❌':'◑'}</span>
        <div class="nm">${fmtDateAz(a.date)}<small>${modeLbl[a.mode]}</small></div>
        <button class="btn sm ghost" onclick="UI.removeAvail(${i})">Sil</button>
      </div>`).join('');
  },
  addAvail(){
    const date=$('#ef_avdate').value, mode=$('#ef_avmode').value;
    if(!date){ toast('Tarix seçin','err'); return; }
    if(this._empAvail.some(a=>a.date===date)){ toast('Bu tarix artıq var','err'); return; }
    this._empAvail.push({date,mode}); this.renderEmpAvail();
  },
  removeAvail(i){ this._empAvail.splice(i,1); this.renderEmpAvail(); },

  saveEmp(){
    const f=this._empForm;
    f.name=$('#ef_name').value.trim();
    f.surname=$('#ef_surname').value.trim();
    f.primaryShift=$('#ef_primary').value;
    if(!f.name){ toast('Ad daxil edin','err'); return; }
    if(!f.canWorkMorning && !f.canWorkEvening){ toast('Ən azı bir smen icazəsi olmalıdır','err'); return; }
    // Daimi olması üçün həmin smendə işləyə bilməlidir
    if(f.permanentMorning) f.canWorkMorning=true;
    if(f.permanentEvening) f.canWorkEvening=true;

    if(f.id){ const i=DB.employees.findIndex(x=>x.id===f.id); DB.employees[i]={...f}; }
    else { f.id=uid('emp'); DB.employees.push({...f}); }
    // Əlçatanlığı yenilə
    DB.availability=DB.availability.filter(a=>a.employeeId!==f.id);
    for(const a of this._empAvail) DB.availability.push({id:uid('av'),employeeId:f.id,date:a.date,mode:a.mode});
    persist();
    toast('Yadda saxlanıldı','ok');
    this.closeEmp();
  },
  deleteEmp(){
    const e=this._empForm; if(!e.id) return;
    openModal(`<h3>İşçini sil</h3><div class="mdesc"><b>${esc(fullName(e))}</b> silinsin? Keçmiş tarixçə saxlanılır, amma işçi siyahılardan çıxarılır.</div>
      <div class="btn-row"><button class="btn ghost block" onclick="closeModal()">İmtina</button>
      <button class="btn danger block" onclick="UI.doDeleteEmp()">Sil</button></div>`);
  },
  doDeleteEmp(){
    const id=this._empForm.id;
    DB.employees=DB.employees.filter(e=>e.id!==id);
    DB.availability=DB.availability.filter(a=>a.employeeId!==id);
    persist(); closeModal(); toast('İşçi silindi');
    $('#empOverlay').classList.remove('open'); this.employees();
  },
});

/* ------------------------- SMENLƏR / BÖLGÜ ---------------------------- */
Object.assign(UI,{
  _replCtx:null,

  setShiftDate(v){ if(!v)return; this.shiftDate=v; this.draft=null; this.shifts(); },

  shifts(){
    const el=$('#view-shifts');
    const date=this.shiftDate;
    const dist=Ops.distributionOf(date);
    const hasDraft=this.draft && this.draft.date===date;

    let body;
    if(hasDraft){ body=this.renderDraft(); }
    else if(dist){ body=this.renderConfirmed(date); }
    else { body=`<div class="empty"><div class="ico">📅</div><b>Bu gün üçün bölgü yoxdur</b>
      Aşağıdakı sayları təyin edib bölgü yaradın.</div>
      <button class="btn primary lg block" onclick="UI.genDraft()">⚡ Bölgü yarat</button>`; }

    el.innerHTML=`
      <div class="page-head"><div><h2>Smenlər</h2><div class="sub">${fmtDateAz(date)} · ${dowAz(date)}</div></div></div>
      <div class="card pad">
        <div class="field" style="margin-bottom:12px"><label>Tarix</label>
          <input class="input" type="date" value="${date}" onchange="UI.setShiftDate(this.value)"></div>
        <div class="shift-setup">
          <div class="shift-box m"><div class="sh-name">🌅 Səhər</div><div class="sh-time">${shiftTime('morning')}</div>
            <div style="font-size:11.5px;color:var(--text-2);margin-bottom:6px">Lazım olan işçi</div>${this.stepper('setM',DB.settings.morningCount)}</div>
          <div class="shift-box e"><div class="sh-name">🌆 Axşam</div><div class="sh-time">${shiftTime('evening')}</div>
            <div style="font-size:11.5px;color:var(--text-2);margin-bottom:6px">Lazım olan işçi</div>${this.stepper('setE',DB.settings.eveningCount)}</div>
        </div>
      </div>
      ${body}`;
  },

  genDraft(){
    if(DB.employees.filter(e=>e.active).length<1){ toast('Əvvəlcə işçi əlavə edin','err'); return; }
    this.draft=Ops.generate(this.shiftDate, DB.settings.morningCount, DB.settings.eveningCount);
    this.shifts();
  },

  renderDraft(){
    const d=this.draft;
    const warnings=[];
    for(const type of ['morning','evening']){
      if(d[type].shortfall>0) warnings.push(`<div class="notice warn"><span class="ni">⚠️</span><div>${shiftName(type)} smeni üçün <b>${d[type].required}</b> nəfər tələb olunur, lakin qaydalara uyğun yalnız <b>${d[type].assigned.length}</b> işçi tapıldı.</div></div>`);
    }
    // Qaralama sütunları
    const cols=['morning','evening'].map(type=>{
      const sh=d[type]; const cls=type==='morning'?'m':'e';
      const rows=sh.assigned.map(a=>{ const e=empById(a.employeeId);
        return `<div class="slot">${avatar(e)}<div class="nm">${esc(fullName(e))}${a.isPermanent?' <small>daimi</small>':''}</div>${a.isPermanent?'<span class="tag perm" style="margin-left:auto">🔒</span>':''}</div>`;
      }).join('');
      const empties=Array(Math.max(0,sh.shortfall)).fill('<div class="slot empty"><div class="nm">Boş yer</div></div>').join('');
      return `<div class="assign-col ${cls}" style="margin-top:12px"><div class="head">${type==='morning'?'🌅 Səhər':'🌆 Axşam'} <span class="cnt">${sh.assigned.length}/${sh.required}</span></div>${rows}${empties}</div>`;
    }).join('');
    // ANALİZ — kim təyin olunmadı və niyə
    const totalActive = DB.employees.filter(e=>e.active).length;
    const placed = new Set([...d.morning.assigned,...d.evening.assigned].map(a=>a.employeeId)).size;
    const unassigned = SmenCore.analyzeUnassigned(d, DB.employees);
    const analysisHtml = unassigned.length?`
      <div class="card pad" style="margin-top:12px">
        <div class="card-title">🔍 Analiz — təyin olunmayanlar (${unassigned.length})</div>
        <div class="muted-note" style="margin-top:0;margin-bottom:10px">${totalActive} aktiv işçidən <b>${placed}</b> nəfər təyin olundu, <b>${unassigned.length}</b> nəfər qaldı.</div>
        ${unassigned.map(u=>{ const e=empById(u.id);
          const lines = u.parts.length
            ? u.parts.map(p=>`<div class="an-line"><span class="tag ${p.shift==='morning'?'morning':'evening'}">${p.label}</span><span>${esc(p.text)}</span></div>`).join('')
            : `<div class="an-line"><span>Bu smenlərə uyğun deyil</span></div>`;
          return `<div class="an-item">${avatar(e)}<div style="flex:1;min-width:0"><div class="an-nm">${esc(fullName(e))}</div>${lines}</div></div>`;
        }).join('')}
        <div class="muted-note">Səbəblər: işçi yalnız səhər/axşam işləyə bilir, dünən işləyib istirahət azdır, bağlı gündür, və ya kifayət qədər işçi seçildiyi üçün yer qalmadı.</div>
      </div>`:'';

    return `<div class="card pad" style="margin-top:12px">
        <div class="card-title">📋 Qaralama bölgü <span class="tag muted" style="margin-left:auto">Təsdiqlənməyib</span></div>
        ${warnings.join('')}
        ${cols}
      </div>
      ${analysisHtml}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn ghost block" onclick="UI.genDraft()">🎲 Yenidən randomla</button>
        <button class="btn primary block" onclick="UI.confirmDraft()">✓ Bölgünü təsdiqlə</button>
      </div>
      <div class="muted-note">Təsdiqlənməyən bölgü tarixçəyə yazılmır. Hər “yenidən randomla” yenə də keçmiş yükü nəzərə alır.</div>`;
  },

  confirmDraft(){ Ops.confirm(this.draft); this.draft=null; toast('Bölgü təsdiqləndi','ok'); this.shifts(); },

  renderConfirmed(date){
    const repls=DB.replacements.filter(r=>r.date===date && !r.undone);
    const replHtml = repls.length?`<div class="card pad" style="margin-top:12px"><div class="card-title">🔄 Əvəzləmələr</div>
      ${repls.map(r=>{const o=empById(r.originalEmployeeId),n=empById(r.replacementEmployeeId);
        return `<div class="slot" style="padding:8px 0"><span class="tag ${r.type==='morning'?'morning':'evening'}">${shiftName(r.type)}</span>
        <div class="nm">${esc(fullName(o))} → <b>${esc(fullName(n))}</b>${r.kind==='manual'?' <small>manual dəyişiklik</small>':''}</div>
        <button class="btn sm ghost" onclick="UI.undoReplace('${r.id}')">↺ Geri qaytar</button></div>`;}).join('')}</div>`:'';
    return `<div class="card pad" style="margin-top:12px">
        <div class="card-title">📋 Təsdiqlənmiş bölgü <span class="tag ok" style="margin-left:auto;background:var(--brand-soft);color:var(--brand-ink)">✓ Aktiv</span></div>
        ${this.assignColumns(date,true)}
      </div>
      ${replHtml}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn ghost block" onclick="UI.regenerate('${date}')">🎲 Yenidən böl</button>
      </div>`;
  },

  regenerate(date){
    openModal(`<h3>Yenidən böl</h3><div class="mdesc">Bu günün təsdiqlənmiş bölgüsü və əvəzləmələri silinib yeni qaralama yaradılacaq. Davam edilsin?</div>
      <div class="btn-row"><button class="btn ghost block" onclick="closeModal()">İmtina</button>
      <button class="btn primary block" onclick="UI.doRegenerate('${date}')">Bəli, yenidən böl</button></div>`);
  },
  doRegenerate(date){ Ops.removeDistribution(date); closeModal(); this.shiftDate=date; this.genDraft(); },

  /* ------------------------- ƏVƏZLƏMƏ MODALI ------------------------- */
  openReplace(date,type,originalId){
    const cands=Ops.replacementCandidates(date,type,originalId);
    this._replCtx={date,type,originalId,cands};
    const orig=empById(originalId);
    const elig=cands.filter(c=>c.eligible), inelig=cands.filter(c=>!c.eligible);
    const rec=elig[0], others=elig.slice(1);

    const candCard=(c,star)=>{ const e=empById(c.id);
      return `<button class="cand ${star?'star':''}" onclick="UI.pickReplace('${c.id}')">
        ${avatar(e)}<div class="ci"><b>${star?'⭐ ':''}${esc(fullName(e))}</b>
        <div class="cmeta">Ümumi: ${c.stats.total} smen · Bu həftə: ${c.stats.last7}</div></div>
        <div class="score"><b>100%</b><span>uyğun</span></div></button>`; };

    let html=`<h3>Əvəzləmə</h3><div class="mdesc"><b>${esc(fullName(orig))}</b> — ${shiftName(type)} smeni, ${fmtDateAz(date)}</div>`;
    if(!elig.length){
      html+=`<div class="notice danger"><span class="ni">⚠️</span><div>Bu smen üçün qaydalara uyğun əvəzçi tapılmadı.</div></div>`;
    } else {
      html+=`<div class="card-title" style="margin-top:4px">Tövsiyə olunan əvəzçi</div>${candCard(rec,true)}`;
      if(others.length){ html+=`<div class="card-title" style="margin-top:14px">Digər uyğun işçilər</div>${others.map(c=>candCard(c,false)).join('')}`; }
    }
    if(inelig.length){
      html+=`<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:650;font-size:13.5px;color:var(--text-2)">Əl ilə seç — uyğun olmayanlar (${inelig.length})</summary>
        <div style="margin-top:8px">${inelig.map(c=>{const e=empById(c.id);
          return `<button class="cand" style="border-style:dashed" onclick="UI.manualReplace('${c.id}')">${avatar(e)}
          <div class="ci"><b>${esc(fullName(e))}</b><div class="cmeta" style="color:var(--danger)">${c.reasons.join(' · ')}</div></div>
          <span class="tag warn">⚠️</span></button>`;}).join('')}</div></details>`;
    }
    html+=`<button class="btn ghost block" style="margin-top:14px" onclick="closeModal()">Bağla</button>`;
    openModal(html);
  },

  pickReplace(newId){
    const {date,type,originalId}=this._replCtx;
    Ops.applyReplacement(date,type,originalId,newId,'auto');
    closeModal(); toast('Əvəzləmə tətbiq olundu','ok'); this.render(this.view);
  },
  manualReplace(newId){
    const {date,type,originalId,cands}=this._replCtx;
    const c=cands.find(x=>x.id===newId); const e=empById(newId);
    openModal(`<h3>⚠️ Xəbərdarlıq</h3>
      <div class="mdesc"><b>${esc(fullName(e))}</b> qaydalara görə uyğun deyil:</div>
      <div class="notice warn"><span class="ni">⚠️</span><div>${c.reasons.join('<br>')}</div></div>
      <div class="muted-note">Yenə də seçsəniz, bu <b>manual dəyişiklik</b> kimi tarixçəyə yazılacaq.</div>
      <div class="btn-row" style="margin-top:14px"><button class="btn ghost block" onclick="UI.openReplace('${date}','${type}','${originalId}')">‹ Geri</button>
      <button class="btn dark block" onclick="UI.confirmManual('${newId}')">Yenə də seç</button></div>`);
  },
  confirmManual(newId){
    const {date,type,originalId}=this._replCtx;
    Ops.applyReplacement(date,type,originalId,newId,'manual');
    closeModal(); toast('Manual əvəzləmə edildi'); this.render(this.view);
  },
  undoReplace(id){ Ops.undoReplacement(id); toast('Əvəzləmə geri qaytarıldı'); this.render(this.view); },
});

/* ------------------------- STATİSTİKA --------------------------------- */
Object.assign(UI,{
  shiftMonth(d){ const [y,m]=this.statMonth.split('-').map(Number); const nm=m-1+d; const ny=y+Math.floor(nm/12); const mm=((nm%12)+12)%12; this.statMonth=`${ny}-${String(mm+1).padStart(2,'0')}`; this.stats(); },

  stats(){
    const el=$('#view-stats');
    const {rows,daysInMonth}=Ops.monthly(this.statMonth);
    const active=rows.filter(r=>r.emp.active || r.total>0);
    active.sort((a,b)=>b.total-a.total || fullName(a.emp).localeCompare(fullName(b.emp),'az'));
    const maxTotal=Math.max(1,...active.map(r=>r.total));
    const fi=Ops.fairness();

    const body = active.length? `
      <div class="tbl-wrap"><table class="stat">
        <thead><tr><th>İşçi</th><th>Ümumi</th><th>Səhər</th><th>Axşam</th><th>Əvəz.</th><th>İşlənən</th><th>İstirahət</th></tr></thead>
        <tbody>${active.map(r=>`<tr>
          <td class="big">${esc(fullName(r.emp))}</td>
          <td class="big"><span class="bar" style="width:${Math.round(r.total/maxTotal*40)}px"></span>${r.total}</td>
          <td>${r.morning}</td><td>${r.evening}</td><td>${r.repl||'–'}</td><td>${r.worked}</td><td>${r.rest}</td>
        </tr>`).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="ico">📊</div><b>Bu ay üçün məlumat yoxdur</b>Smen bölgüsü təsdiqləndikcə statistika buraya düşəcək.</div>`;

    el.innerHTML=`
      <div class="page-head"><div><h2>Statistika</h2><div class="sub">Aylıq iş yükü</div></div></div>
      <div class="card pad spread" style="padding:10px 12px">
        <button class="btn sm ghost" onclick="UI.shiftMonth(-1)">‹</button>
        <b style="font-size:15px">${monthLabelAz(this.statMonth)}</b>
        <button class="btn sm ghost" onclick="UI.shiftMonth(1)">›</button>
      </div>
      <div class="card pad" style="margin-top:12px">${body}</div>
      <div class="card pad" style="margin-top:12px">
        <div class="stat-mini">
          <div><b>${fi.pct}%</b><span>Ədalət</span></div>
          <div><b>${fi.mean}</b><span>Orta smen</span></div>
          <div><b>${fi.spread}</b><span>Ən böyük fərq</span></div>
        </div>
      </div>`;
  },

  /* ------------------------- TARİXÇƏ --------------------------------- */
  history(){
    const el=$('#view-history');
    const dists=[...DB.distributions].sort((a,b)=>b.date.localeCompare(a.date));
    const cards=dists.map(d=>{
      const m=Ops.assignmentsOf(d.date,'morning').length, e=Ops.assignmentsOf(d.date,'evening').length;
      const repls=DB.replacements.filter(r=>r.date===d.date && !r.undone);
      return `<div class="card pad hist-card" onclick="UI.openHist('${d.date}')">
        <div class="hh"><div style="width:44px;height:44px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex:none">
          <div style="text-align:center;line-height:1"><b style="font-size:16px">${partsOf(d.date).d}</b><div style="font-size:9px;color:var(--text-2)">${AY[partsOf(d.date).m-1].slice(0,3)}</div></div></div>
          <div><b>${fmtDateAz(d.date)}</b><div class="sub" style="color:var(--text-2);font-size:12px">${dowAz(d.date)}</div></div>
          <span style="margin-left:auto;color:var(--text-3)">›</span></div>
        <div class="hline"><span class="chip">🌅 ${m} səhər</span><span class="chip">🌆 ${e} axşam</span>
          ${repls.length?`<span class="chip repl">🔄 ${repls.length} əvəzləmə</span>`:''}</div>
      </div>`;
    }).join('');
    el.innerHTML=`
      <div class="page-head"><div><h2>Tarixçə</h2><div class="sub">${dists.length} təsdiqlənmiş bölgü</div></div></div>
      ${dists.length? cards : `<div class="empty"><div class="ico">📜</div><b>Tarixçə boşdur</b>Təsdiqlənmiş bölgülər burada saxlanılır.</div>`}`;
  },
  openHist(date){
    $('#histOvTitle').textContent=fmtDateAz(date);
    const repls=DB.replacements.filter(r=>r.date===date && !r.undone);
    const replHtml=repls.length?`<div class="card pad" style="margin-top:12px"><div class="card-title">🔄 Əvəzləmələr</div>
      ${repls.map(r=>{const o=empById(r.originalEmployeeId),n=empById(r.replacementEmployeeId);
        return `<div class="slot" style="padding:8px 0"><span class="tag ${r.type==='morning'?'morning':'evening'}">${shiftName(r.type)}</span>
        <div class="nm">${esc(fullName(o))} → <b>${esc(fullName(n))}</b>${r.kind==='manual'?' <small>manual</small>':''}</div>
        <button class="btn sm ghost" onclick="UI.undoReplace('${r.id}');UI.openHist('${date}')">↺ Geri</button></div>`;}).join('')}</div>`:'';
    $('#histOvBody').innerHTML=`
      <div class="card pad"><div class="card-title">📋 Bölgü</div>${this.assignColumns(date,true)}</div>
      ${replHtml}
      <div class="btn-row" style="margin-top:14px">
        <button class="btn ghost block" onclick="UI.closeHist();UI.shiftDate='${date}';UI.draft=null;UI.go('shifts')">Smenlər səhifəsində aç</button>
      </div>`;
    $('#histOverlay').classList.add('open');
  },
  closeHist(){ $('#histOverlay').classList.remove('open'); this.history(); },

  /* ------------------------- PARAMETRLƏR ----------------------------- */
  settings(){
    const s=DB.settings, el=$('#view-settings');
    const timeField=(k,lbl)=>`<div class="field"><label>${lbl}</label><input class="input" type="time" value="${s[k]}" onchange="UI.setParam('${k}',this.value)"></div>`;
    const numField=(k,lbl,min,max)=>`<div class="field"><label>${lbl}</label><input class="input num" type="number" min="${min}" max="${max}" value="${s[k]}" onchange="UI.setParam('${k}',this.value)"></div>`;
    el.innerHTML=`
      <div class="page-head"><div><h2>Parametrlər</h2><div class="sub">Qaydalar və balans</div></div></div>
      <div class="card pad"><div class="card-title">🕐 Smen saatları</div>
        <div class="grid2">${timeField('morningStart','Səhər başlanğıcı')}${timeField('morningEnd','Səhər bitişi')}</div>
        <div class="grid2">${timeField('eveningStart','Axşam başlanğıcı')}${timeField('eveningEnd','Axşam bitişi')}</div>
      </div>
      <div class="card pad" style="margin-top:12px"><div class="card-title">📏 İş qaydaları</div>
        <div class="grid2">${numField('minRestHours','Minimum istirahət (saat)',1,48)}${numField('maxConsecutiveDays','Maks. ardıcıl iş günü',1,31)}</div>
      </div>
      <div class="card pad" style="margin-top:12px"><div class="card-title">⚖️ Ədalət / random balansı</div>
        <div class="field"><label>Ədalət çəkisi: <b id="fwLab">${s.fairnessWeight.toFixed(2)}</b></label>
          <input type="range" min="0.1" max="1" step="0.05" value="${s.fairnessWeight}" style="width:100%" oninput="UI.setWeight('fairnessWeight',this.value)"></div>
        <div class="field" style="margin-bottom:0"><label>Random çəkisi: <b id="rwLab">${s.randomWeight.toFixed(2)}</b></label>
          <input type="range" min="0.1" max="1" step="0.05" value="${s.randomWeight}" style="width:100%" oninput="UI.setWeight('randomWeight',this.value)"></div>
        <div class="muted-note">Ədalət çəkisi yüksək olduqca az işləyən işçilər daha güclü prioritet alır. Random çəkisi yüksəldikcə seçim daha təsadüfi olur.</div>
      </div>
      <div class="card pad" style="margin-top:12px"><div class="card-title">👥 Standart işçi sayı</div>
        <div class="grid2">${numField('morningCount','Səhər',1,30)}${numField('eveningCount','Axşam',1,30)}</div>
      </div>
      <div class="card pad" style="margin-top:12px"><div class="card-title">💾 Yedəkləmə (Arxiv)</div>
        <button class="btn primary block" onclick="UI.exportBackup()">Yedək faylı endir</button>
        <label class="btn ghost block file-btn" style="margin-top:10px">Yedəyi geri yüklə
          <input type="file" accept="application/json,.json" style="display:none" onchange="UI.importBackup(this)"></label>
        <div class="muted-note">Yedək faylını cihazına endir və təhlükəsiz yerdə saxla. Brauzer məlumatı silinsə, həmin faylı “geri yüklə” ilə hər şeyi bərpa edə bilərsən.</div>

      <div class="card pad" style="margin-top:12px"><div class="card-title">🗄️ Məlumat</div>
        <button class="btn ghost block" onclick="UI.seedDemo()">Nümunə məlumat yüklə (10 işçi + tarixçə)</button>
        <button class="btn danger block" style="margin-top:10px" onclick="UI.resetAll()">Bütün məlumatı sıfırla</button>

  setParam(k,v){ if(k==='minRestHours'||k==='maxConsecutiveDays'){ v=Math.max(1,parseInt(v)||1); } if(k==='morningCount'||k==='eveningCount'){ v=Math.max(1,parseInt(v)||1);} DB.settings[k]=v; persist(); if(k==='morningCount'||k==='eveningCount') return; },
  setWeight(k,v){ DB.settings[k]=parseFloat(v); persist(); const id=k==='fairnessWeight'?'fwLab':'rwLab'; const lab=$('#'+id); if(lab)lab.textContent=parseFloat(v).toFixed(2); },

  seedDemo(){
    openModal(`<h3>Nümunə məlumat</h3><div class="mdesc">10 işçi və son 12 günün tarixçəsi yaradılacaq. Mövcud məlumat silinəcək. Davam edilsin?</div>
      <div class="btn-row"><button class="btn ghost block" onclick="closeModal()">İmtina</button>
      <button class="btn primary block" onclick="UI.doSeed()">Yüklə</button></div>`);
  },
  doSeed(){
    DB={ employees:[], assignments:[], availability:[], replacements:[], distributions:[], settings:{...DEFAULT_SETTINGS}, seeded:true };
    const defs=[['Əli','Hüseynov',{pm:1}],['Vüqar','Məmmədov',{pm:1}],['Kamran','Əliyev',{pe:1}],
      ['Murad','Quliyev',{}],['Samir','Nəbiyev',{}],['Rauf','Cəfərov',{}],['Tural','Hümbətov',{}],
      ['Elvin','Sadıqov',{}],['Orxan','Vəliyev',{}],['Nihat','Kərimov',{}]];
    for(const [n,s,o] of defs){ DB.employees.push({ id:uid('emp'), name:n, surname:s, active:true,
      primaryShift:o.pe?'evening':'morning', canWorkMorning:true, canWorkEvening:true,
      permanentMorning:!!o.pm, permanentEvening:!!o.pe }); }
    // Son 12 günün balanslı tarixçəsi
    for(let i=12;i>=1;i--){ const day=addDaysISO(todayISO(),-i); const draft=Ops.generate(day,4,5); Ops.confirm(draft); }
    persist(); closeModal(); toast('Nümunə məlumat yükləndi','ok'); this.go('dashboard');
  },
  resetAll(){
    openModal(`<h3>Sıfırla</h3><div class="mdesc">Bütün işçilər, bölgülər və tarixçə silinəcək. Bu əməliyyat geri qaytarıla bilməz.</div>
      <div class="btn-row"><button class="btn ghost block" onclick="closeModal()">İmtina</button>
      <button class="btn danger block" onclick="UI.doReset()">Hər şeyi sil</button></div>`);
  },
  doReset(){ localStorage.removeItem(Store.KEY); initDB(); persist(); closeModal(); toast('Məlumat sıfırlandı'); this.go('dashboard'); },

  /* ------------------------- YEDƏKLƏMƏ / ARXİV ---------------------- */
  exportBackup(){
    try{
      const payload={ _app:'smen-bolgusu', _version:1, _exportedAt:new Date().toISOString(), data:DB };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`smen-yedek-${todayISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      const c=DB.employees.length, d=DB.distributions.length;
      toast(`Yedək endirildi: ${c} işçi, ${d} gün`,'ok');
    }catch(err){ toast('Yedək yaradıla bilmədi','err'); }
  },
  importBackup(input){
    const file=input.files&&input.files[0];
    if(!file){ return; }
    const reader=new FileReader();
    reader.onload=e=>{
      input.value=''; // eyni faylı təkrar seçə bilmək üçün
      let obj;
      try{ obj=JSON.parse(e.target.result); }
      catch(err){ toast('Fayl oxunmadı (yanlış format)','err'); return; }
      const d = obj && obj.data && Array.isArray(obj.data.employees) ? obj.data
              : (obj && Array.isArray(obj.employees) ? obj : null); // köhnə/düz formatı da qəbul et
      if(!d || !Array.isArray(d.employees) || !Array.isArray(d.assignments)){
        toast('Bu düzgün yedək faylı deyil','err'); return;
      }
      this._pendingImport=d;
      const emps=d.employees.length, dists=(d.distributions||[]).length;
      openModal(`<h3>Yedəyi geri yüklə</h3><div class="mdesc">Fayldan <b>${emps} işçi</b> və <b>${dists} günlük tarixçə</b> tapıldı. Hazırkı bütün məlumat bununla əvəz olunacaq. Davam edilsin?</div>
        <div class="btn-row"><button class="btn ghost block" onclick="UI._pendingImport=null;closeModal()">İmtina</button>
        <button class="btn primary block" onclick="UI.doImport()">Geri yüklə</button></div>`);
    };
    reader.onerror=()=>{ input.value=''; toast('Fayl oxunmadı','err'); };
    reader.readAsText(file);
  },
  doImport(){
    const d=this._pendingImport;
    if(!d){ return closeModal(); }
    DB={
      employees:    d.employees    || [],
      assignments:  d.assignments  || [],
      availability: d.availability || [],
      replacements: d.replacements || [],
      distributions:d.distributions|| [],
      settings:     Object.assign({...DEFAULT_SETTINGS}, d.settings||{}),
      seeded:       d.seeded || false
    };
    persist(); this._pendingImport=null; closeModal();
    toast('Məlumat geri yükləndi','ok'); this.go('dashboard');
  },
});

      name:"Smen Bölgüsü — Ədalətli Planlama", short_name:"Smen Bölgüsü",

      ]
    };
    const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
